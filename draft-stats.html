<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Inn stats</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; background: #0b0806; color: #f0e4cc; font: 15px/1.45 system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
.back { display: inline-block; margin: 0 0 10px; padding: 6px 12px; font-size: 14px; color: #ffd76a; text-decoration: none; border: 1px solid #3a2c18; border-radius: 999px; background: #140d07; }
.sat { color: #57d683; }
.col { display: inline-flex; flex-wrap: wrap; gap: 3px; margin-left: 6px; vertical-align: middle; }
.col img { width: 18px; height: 18px; border-radius: 3px; box-shadow: 0 0 0 1px var(--q); }
.back:hover { border-color: #c9a24a; }
@media (min-width: 701px) { .back { display: none; } }
h1 { margin: 0; font-size: 20px; color: #ffd76a; }
h2 { margin: 22px 0 8px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #c9a24a; }
.at { color: #8f8170; font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 12px; }
.tile { padding: 10px 12px; border: 1px solid #3a2c18; border-radius: 10px; background: #140d07; }
.tile b { display: block; font-size: 22px; color: #ffe6b0; }
.tile small { color: #a89c88; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 7px 6px; text-align: left; border-bottom: 1px solid #241a0e; }
th { color: #a89c88; font-weight: 500; font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
.s6 { color: #9dff7a; font-weight: 600; }
.s5 { color: #ffd76a; }
.won { color: #9dff7a; } .lost { color: #ff9a7a; }
.tag { display: inline-block; padding: 1px 6px; margin: 1px 2px 1px 0; border-radius: 6px; font-size: 12px; background: #241a0e; color: #d8c8a8; }
.tag.l { background: #2e2610; color: #ffe39a; }
.err { color: #ff9a7a; }
.wrap { overflow-x: auto; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.bar button { padding: 6px 12px; font: inherit; font-size: 14px; color: #d8c8a8; cursor: pointer; border: 1px solid #3a2c18; border-radius: 999px; background: #140d07; }
.bar button.on { color: #1a1006; border-color: #ffe39a; background: #ffd76a; }
.tabs button { border-radius: 8px; }
.tabs button.on { color: #ffe39a; background: #2a1d0c; border-color: #c99a3b; }
.chart { display: flex; align-items: flex-end; gap: 2px; height: 120px; border-bottom: 1px solid #3a2c18; }
.chart i { flex: 1; min-width: 2px; background: #c99a3b; border-radius: 2px 2px 0 0; }
.chart i:hover { background: #ffe39a; }
.axis { display: flex; justify-content: space-between; font-size: 12px; color: #8f8170; margin-top: 4px; }
.cls { font-weight: 600; }
</style>
</head>
<body>
<main>
<a class="back" href="draft.html" onclick="if (history.length > 1) { history.back(); return false; }">&larr; Back to the Draft</a>
<h1>Inn stats</h1>
<p class="at" id="at">Loading…</p>
<div class="bar tabs" id="tabs"></div>
<div class="bar" id="range"></div>
<div id="out"></div>
</main>
<script>
const API = location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? 'http://localhost:8789' : 'https://azeroth-draft.sanredz.workers.dev';
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'now' : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.floor(m / 60)}h ${m % 60}m ago` : `${Math.floor(m / 1440)}d ago`; };
const clock = (t) => new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const num = (n) => Number(n || 0).toLocaleString();
const RAID = { mc: 'MC', zg: 'ZG', aq20: 'AQ20' };
const FINAL = { mc: 9, zg: 9, aq20: 5 };
const CC = { WARRIOR: '#C69B6D', PALADIN: '#F48CBA', HUNTER: '#AAD372', ROGUE: '#FFF468', PRIEST: '#FFFFFF', SHAMAN: '#0070DD', MAGE: '#3FC7EB', WARLOCK: '#8788EE', DRUID: '#FF7C0A' };
const cls = (c) => `<span class="cls" style="color:${CC[c] || '#d8c8a8'}">${esc((c || '').charAt(0) + (c || '').slice(1).toLowerCase())}</span>`;
const tile = (v, l) => `<div class="tile"><b>${esc(v)}</b><small>${esc(l)}</small></div>`;
const table = (head, rows) => (rows.length ? `<div class="wrap"><table><tr>${head.map((h) => `<th${h.startsWith('#') ? ' class="n"' : ''}>${esc(h.replace(/^#/, ''))}</th>`).join('')}</tr>${rows.join('')}</table></div>` : '<p>Nothing in this range.</p>');
const TABS = [['all', 'Overview'], ['gear', 'Gear Draft'], ['arena', 'Arena'], ['raid', 'Raids'], ['kazzak', 'Kazzak']];
const RANGES = [[24, 'Last 24h'], [168, '7 days'], [720, '30 days'], [0, 'All time']];
const pref = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const keep = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let tab = pref('statsTab', 'all'), hours = +pref('statsHours', 24), stats = null, modes = null;

function chart(m, lists) {
  const step = m.step, start = Math.floor(m.since / step), end = Math.floor(m.at / step), n = {};
  for (const l of lists) for (const x of l) n[x.b] = (n[x.b] || 0) + x.n;
  const keys = [];
  for (let b = start; b <= end; b++) keys.push(b);
  const max = Math.max(1, ...keys.map((b) => n[b] || 0));
  const label = (b) => (step === 3600000 ? new Date(b * step).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : new Date(b * step).toLocaleDateString([], { month: 'short', day: 'numeric' }));
  return `<h2>Runs per ${step === 3600000 ? 'hour' : 'day'}</h2><div class="chart">${keys.map((b) => `<i style="height:${((n[b] || 0) / max) * 100}%" title="${esc(label(b))}: ${n[b] || 0} runs"></i>`).join('')}</div><div class="axis"><span>${esc(label(start))}</span><span>peak ${max}</span><span>${esc(label(end))}</span></div>`;
}

function overview(m) {
  const g = m.gear, a = m.arena, r = m.raid, w = m.world;
  return `<div class="tiles">${tile(num(g.n + a.n + r.n + w.n), 'runs, all modes')}${tile(num(g.n), 'Gear Drafts')}${tile(num(a.n), 'Arena runs')}${tile(num(r.n), 'raids')}${tile(num(w.n), 'Kazzak fights')}</div>
    ${chart(m, [g.buckets, a.buckets, r.buckets, w.buckets])}
    <h2>By mode</h2>${table(['Mode', '#Runs', '#Players', '#Runs per player'], [['Gear Draft', g], ['Arena', a], ['Raids', r], ['Kazzak', w]].map(([k, x]) => `<tr><td>${k}</td><td class="n">${num(x.n)}</td><td class="n">${num(x.p)}</td><td class="n">${x.p ? (x.n / x.p).toFixed(1) : '–'}</td></tr>`))}`;
}

function gear(m) {
  const g = m.gear;
  return `<div class="tiles">${tile(num(g.n), 'drafts')}${tile(num(g.p), 'players')}${tile(num(Math.round(g.best || 0)), 'best DPS')}${tile(g.p ? (g.n / g.p).toFixed(1) : '–', 'drafts per player')}</div>
    ${chart(m, [g.buckets])}
    <h2>Classes</h2>${table(['Class', '#Drafts', '#Players', '#Avg DPS', '#Best'], g.classes.map((c) => `<tr><td>${cls(c.cls)}</td><td class="n">${num(c.n)}</td><td class="n">${num(c.p)}</td><td class="n">${num(c.avg)}</td><td class="n">${num(Math.round(c.best))}</td></tr>`))}
    <h2>Most drafts</h2>${table(['Player', '#Drafts', '#Best DPS', '#Last'], g.players.map((p) => `<tr><td>${esc(p.name || 'Unnamed')}</td><td class="n">${num(p.n)}</td><td class="n">${num(Math.round(p.best))}</td><td class="n">${ago(p.last)}</td></tr>`))}
    <h2>Latest drafts</h2>${table(['When', 'Player', 'Class', '#DPS'], g.recent.map((x) => `<tr><td>${clock(x.at)}</td><td>${esc(x.name || 'Unnamed')}</td><td>${cls(x.cls)}</td><td class="n">${num(Math.round(x.dps))}</td></tr>`))}`;
}

function arena(m) {
  const a = m.arena;
  return `<div class="tiles">${tile(num(a.n), 'runs')}${tile(num(a.p), 'players')}${tile(a.avg ?? '–', 'average wins')}${tile(num(a.ten), '10-win runs')}${tile(a.best ?? '–', 'most wins')}</div>
    ${chart(m, [a.buckets])}
    <h2>Classes</h2>${table(['Class', '#Runs', '#Players', '#Avg wins', '#10-win', '#Best'], a.classes.map((c) => `<tr><td>${cls(c.cls)}</td><td class="n">${num(c.n)}</td><td class="n">${num(c.p)}</td><td class="n">${c.avg}</td><td class="n">${num(c.ten)}</td><td class="n">${c.best}</td></tr>`))}
    <h2>Most runs</h2>${table(['Player', '#Runs', '#Best', '#Last'], a.players.map((p) => `<tr><td>${esc(p.name || 'Unnamed')}</td><td class="n">${num(p.n)}</td><td class="n">${p.best}</td><td class="n">${ago(p.last)}</td></tr>`))}
    <h2>Latest runs</h2>${table(['When', 'Player', 'Class', '#Record'], a.recent.map((x) => `<tr><td>${clock(x.at)}</td><td>${esc(x.name || 'Unnamed')}</td><td>${cls(x.cls)}</td><td class="n">${x.wins}-${x.losses}</td></tr>`))}`;
}

const QCOL = { Common: '#f4ead8', Uncommon: '#1eff00', Rare: '#3a9bff', Epic: '#b45cff', Legendary: '#ff8000', Mythic: '#3dffb0' };
function raid(m) {
  const r = m.raid;
  return `<div class="tiles">${tile(num(r.n), 'raids')}${tile(num(r.p), 'players')}${tile(num(r.finals), 'full clears')}${tile(r.n ? `${Math.round((r.finals / r.n) * 100)}%` : '–', 'clear rate')}</div>
    ${chart(m, [r.buckets])}
    <h2>Raids</h2>${table(['Raid', '#Runs', '#Players', '#Full clears', '#Clear rate', '#Avg bosses'], r.raids.map((x) => `<tr><td>${RAID[x.raid] || esc(x.raid)}</td><td class="n">${num(x.n)}</td><td class="n">${num(x.p)}</td><td class="n">${num(x.finals)}</td><td class="n">${Math.round((x.finals / x.n) * 100)}%</td><td class="n">${x.avg} of ${FINAL[x.raid] || '?'}</td></tr>`))}
    <h2>Most raids</h2>${table(['Player', '#Raids', '#Full clears', '#Last'], r.players.map((p) => `<tr><td>${esc(p.name || 'Unnamed')}${p.sat != null ? ` <span class="sat" title="Consumables in satchel">(${p.sat})</span>` : ''}${p.col && p.col.length ? `<span class="col">${p.col.map((c) => `<img src="assets/icons/${c.icon}.png" alt="${esc(c.name)}" title="${esc(c.name)}" style="--q:${QCOL[c.rarity] || '#888'}">`).join('')}</span>` : ''}</td><td class="n">${num(p.n)}</td><td class="n">${num(p.finals)}</td><td class="n">${ago(p.last)}</td></tr>`))}
    <h2>Latest raids</h2>${table(['When', 'Player', 'Raid', '#Bosses'], r.recent.map((x) => `<tr><td>${clock(x.at)}</td><td>${esc(x.name || 'Unnamed')}</td><td>${RAID[x.raid] || esc(x.raid)}</td><td class="n ${x.kills === FINAL[x.raid] ? 'won' : ''}">${x.kills} of ${FINAL[x.raid] || '?'}</td></tr>`))}`;
}

function kazzak(d, m) {
  const since = m ? m.since : 0, tries = d.kazzak.filter((k) => k.at >= since), kills = tries.filter((k) => k.won).length;
  return `<div class="tiles">${tile(`${kills}/${tries.length}`, 'Kazzak kills')}${tile(d.forged.length, 'seals broken, all time')}${tile(d.open.length, 'fighting now')}${tile(new Set((d.saves || []).map((x) => x.name)).size, 'saved their code')}</div>
    ${m ? chart(m, [m.world.buckets]) : ''}
    ${d.open.length ? `<h2>Fighting Kazzak right now</h2><p>${d.open.map((o) => `<b>${esc(o.name || 'Unnamed')}</b> started ${ago(o.at)}`).join('<br>')}</p>` : ''}
    <h2>Kazzak attempts</h2>
    ${tries.length ? `<div class="wrap"><table><tr><th>When</th><th>Player</th><th>Result</th><th class="n">Time</th></tr>${tries.map((k) => `<tr><td>${clock(k.at)}</td><td>${esc(k.name || 'Unnamed')}</td><td class="${k.won ? 'won' : 'lost'}">${k.won ? 'Killed him' : `Lost, he had ${Math.round(k.health * 1000) / 10}%`}${k.used ? ' · consumables' : ''}</td><td class="n">${Math.floor(k.time / 60)}:${String(Math.round(k.time % 60)).padStart(2, '0')}</td></tr>`).join('')}</table></div>` : '<p>None in this range.</p>'}
    <h2>Seals broken</h2>
    ${d.forged.length ? `<p>${d.forged.map((f) => `<b>${esc(f.name || 'Unnamed')}</b> ${clock(f.forged)}`).join('<br>')}</p>` : '<p>Nobody yet.</p>'}
    <h2>Hearthstone codes copied</h2>
    ${(d.saves || []).length ? `<div class="wrap"><table><tr><th>When</th><th>Player</th><th>From</th></tr>${d.saves.map((x) => `<tr><td>${clock(x.at)}</td><td>${esc(x.name || 'Unnamed')}</td><td>${x.src === 'nudge' ? 'Reminder card' : 'Hearthstone box'}</td></tr>`).join('')}</table></div>` : '<p>Nobody yet.</p>'}
    <h2>Attunement</h2>
    <div class="wrap"><table><tr><th>Player</th><th class="n">Seals</th><th>Pieces / Paladin runs</th><th class="n">Raids</th><th class="n">Last</th></tr>${d.players.map((p) => `<tr><td>${esc(p.name)}</td><td class="n ${p.steps === 6 ? 's6' : p.steps === 5 ? 's5' : ''}">${p.steps}/6</td><td>${p.pieces.map((x) => `<span class="tag">${RAID[x]}</span>`).join('')}${p.light.map((x) => `<span class="tag l">${RAID[x]} Light</span>`).join('') || (p.pieces.length ? '' : '–')}</td><td class="n">${p.raids}</td><td class="n">${ago(p.last)}</td></tr>`).join('')}</table></div>`;
}

function draw() {
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button type="button" data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('');
  document.getElementById('range').innerHTML = RANGES.map(([h, l]) => `<button type="button" data-h="${h}" class="${h === hours ? 'on' : ''}">${l}</button>`).join('');
  const out = document.getElementById('out');
  if (tab === 'kazzak') out.innerHTML = stats ? kazzak(stats, modes) : '<p>Loading…</p>';
  else if (!modes) out.innerHTML = '<p>Loading…</p>';
  else out.innerHTML = ({ all: overview, gear, arena, raid })[tab](modes);
}

document.getElementById('tabs').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; keep('statsTab', tab); draw(); };
document.getElementById('range').onclick = (e) => { const b = e.target.closest('[data-h]'); if (!b) return; hours = +b.dataset.h; keep('statsHours', hours); modes = null; draw(); load(); };

async function post(path, body) {
  const r = await fetch(`${API}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) throw new Error(d && d.error === 'nope' ? 'This page only works on your own device, signed in with your Hearth.' : 'Could not load.');
  return d;
}

async function load() {
  const key = pref('draftKey', ''), want = hours;
  try {
    const [s, m] = await Promise.all([post('/admin/stats', { key }), post('/admin/modes', { key, hours: want })]);
    if (want !== hours) return;
    stats = s;
    modes = m;
  } catch (e) { document.getElementById('at').innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
  document.getElementById('at').textContent = `Updated ${new Date(modes.at).toLocaleTimeString()} · refreshes every minute · from ${clock(modes.since)}`;
  draw();
}
if (!TABS.some((t) => t[0] === tab)) tab = 'all';
if (!RANGES.some((r) => r[0] === hours)) hours = 24;
draw();
load();
setInterval(load, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
</script>
</body>
</html>
